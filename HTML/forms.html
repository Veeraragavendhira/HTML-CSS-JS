<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>

.container{
  display:flex;
}

.box{
  flex:1;
  padding:20px;
  background:lightblue;
  margin:5px;
}
@media (max-width:600px){
  .container{
    flex-direction:column;
  }
}

</style>
</head>
<body>

<div class="container">
  <div class="box">Box 1</div>
  <div class="box">Box 2</div>
</div>
</body>
</html>
