<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordered List</title>
</head>
<body>
    <ol type="A">
        <li>one</li>
        <li>Two</li>
        <li>three</li>
    </ol>
    <ol type="a">
        <li>one</li>
        <li>Two</li>
        <li>three</li>
    </ol>
    <ol type="i">
        <li>one</li>
        <li>Two</li>
        <li>three</li>
    </ol>
    <ol type="I">
        <li>one</li>
        <li>Two</li>
        <li>three</li>
    </ol>
    <ol start="10">
        <li>one</li>
        <li>Two</li>
        <li>three</li>
    </ol>
     <ol reversed>
        <li>one</li>
        <li>Two</li>
        <li>three</li>
    </ol>
</body>
</html>
